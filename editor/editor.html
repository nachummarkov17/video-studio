<!doctype html><html><head><meta charset="utf-8">
<title>Video Studio Editor</title></head>
<body style="background:#0f1512;color:#eaf2ef;font-family:Segoe UI">
<div id="status">starting…</div>
<script type="module">
import { send, onMessage } from './js/bridge.js';
onMessage(m => { if (m.type==='pong') document.getElementById('status').textContent = 'bridge OK: ' + m.echo; });
send({ type:'ping', echo:'hello' });
</script></body></html>
