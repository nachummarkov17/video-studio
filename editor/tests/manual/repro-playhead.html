<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/css/editor.css"></head>
<body style="margin:0">
<div class="app-shell"><section class="panel panel-timeline" style="height:360px">
<div id="timeline" class="timeline">
  <div id="ruler" class="ruler"></div><div id="tracks" class="tracks"></div>
  <div id="playhead" class="playhead"><span class="playhead-grab"></span></div>
</div></section></div>
<canvas id="cv" width="1080" height="1920" style="display:none"></canvas>
<pre id="out">running…</pre>
<script type="module">
import { newProject, addAsset, addClip, addTrackForType } from '/js/model.js';
import { TimelineUI } from '/js/timeline-ui.js';
import { Preview } from '/js/preview.js';

const L=[]; const say=m=>{L.push(m);document.getElementById('out').textContent=L.join(String.fromCharCode(10));};
const ok=(c,m)=>say((c?'PASS: ':'FAIL: ')+m);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const project = newProject('9:16');
const main = addTrackForType(project,'video');
const a = addAsset(project,{path:'output/x.mp4',type:'video',naturalW:1080,naturalH:1920,duration:60});
addClip(project,main,{assetId:a,start:0,in:0,duration:60});

const app = {
  project, selectedId:null, playhead:0, pxPerSec:20, snapping:true,
  inspector:{show(){},clear(){}},
  refreshPreview(){ preview.setTime(app.playhead); },
  commit(){ app.timeline.render(); app.refreshPreview(); },
  onPlayheadChange(){}, pausePlayback(){ preview.pause(); },
  addAssetAndClip:async()=>{}, pushHistory(){},
};
const preview = new Preview(document.getElementById('cv'), project, () => 'data:,');
app.preview = preview;
app.timeline = new TimelineUI(document.getElementById('timeline'), app);

const tr = () => document.getElementById('tracks').getBoundingClientRect();
const xOf = t => tr().left + 64 + t*app.pxPerSec;
// A real click is never instantaneous: frames tick between press and release,
// and that gap is exactly where the bug lived. Firing both events back to back
// is how an earlier version of this probe "passed" with the bug still present.
const press = (el,x,y) => el.dispatchEvent(new MouseEvent('mousedown',{clientX:x,clientY:y,bubbles:true,cancelable:true}));
const release = () => document.dispatchEvent(new MouseEvent('mouseup',{bubbles:true}));
const click = async (el,x,y) => { press(el,x,y); await wait(120); release(); };
const ruler = document.getElementById('ruler');
const ry = () => ruler.getBoundingClientRect().top + 5;

(async () => {
  // --- A: stopped ---------------------------------------------------------
  app.playhead = 0; app.timeline.setPlayhead(0);
  await click(ruler, xOf(25), ry());
  const a1 = app.playhead;
  await wait(400);
  const a2 = app.playhead;
  ok(Math.abs(a1-25)<0.5, 'STOPPED: click sets the playhead (' + a1.toFixed(2) + ')');
  ok(Math.abs(a2-25)<0.5, 'STOPPED: and it stays there after 400ms (' + a2.toFixed(2) + ')');

  // --- B: with the REAL playback loop running ------------------------------
  // (the previous version of this probe drove a hand-written interval, which is
  //  exactly why it failed to catch what was actually happening)
  preview.onTick = (t) => { if (preview.isScrubbing && preview.isScrubbing()) return; app.playhead = t; app.timeline.setPlayhead(t); };
  app.playhead = 3; preview._t = 3;
  // requestAnimationFrame doesn't run under a headless browser, so drive the
  // REAL per-frame step directly. This is the whole point: the previous version
  // of this probe reimplemented the loop by hand and therefore never exercised
  // the line that was actually causing the bug.
  preview.playing = true;
  preview._t = 3; preview._anchorT = 3; preview._anchorPerf = performance.now();
  let clock = performance.now();
  const loop = setInterval(() => { clock += 16; preview._tick(clock); }, 16);

  await wait(250);
  ok(app.playhead > 3.1, 'the real per-frame step is advancing the playhead (' + app.playhead.toFixed(2) + ')');
  const before = app.playhead;
  press(ruler, xOf(40), ry());
  const justAfter = app.playhead;
  await wait(120);                      // frames tick while the button is held
  const held = app.playhead;
  ok(Math.abs(held-40)<0.5, 'PLAYING: it stays put while the button is held (' + held.toFixed(2) + ')');
  release();
  await wait(400);
  const settled = app.playhead;
  clearInterval(loop);
  preview.pause();

  ok(Math.abs(justAfter-40)<0.5, 'PLAYING: the click does move it at first (' + justAfter.toFixed(2) + ')');
  ok(settled >= 40 && settled < 42,
     'PLAYING: and it STAYS near 40 - it was ' + before.toFixed(2) + ' before the click, ' +
     justAfter.toFixed(2) + ' just after, ' + settled.toFixed(2) + ' once settled');

  document.getElementById('out').textContent = L.join(String.fromCharCode(10));
})().catch(e => ok(false,'ERROR '+e.message));
</script>
</body></html>
