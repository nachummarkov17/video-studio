<!doctype html>
<!-- Manual browser probe. The unit tests cover pure logic; this covers the
     DOM/interaction layer, which node cannot exercise.
     Run:  cd editor && python -m http.server 8766
           then open  http://localhost:8766/tests/manual/<this file>  -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/css/editor.css"></head>
<body style="margin:0">
<div class="app-shell"><section class="panel panel-timeline" style="height:400px">
<div id="timeline" class="timeline">
  <div id="ruler" class="ruler"></div>
  <div id="tracks" class="tracks"></div>
  <div id="playhead" class="playhead"><span class="playhead-grab"></span></div>
</div></section></div>
<pre id="out">running…</pre>
<script type="module">
import { newProject, addAsset, addClip, addTrackForType, findClip } from '/js/model.js';
import { TimelineUI } from '/js/timeline-ui.js';

const L = [];
const ok = (c, m) => { L.push((c ? 'PASS: ' : 'FAIL: ') + m); document.getElementById('out').textContent = L.join(String.fromCharCode(10)); };
// rAF can stall under headless virtual time; fall back to a timer so the
// probe always makes progress.
const frame = () => new Promise(r => { let done = false;
  const fin = () => { if (!done) { done = true; r(); } };
  requestAnimationFrame(() => requestAnimationFrame(fin));
  setTimeout(fin, 60); });
// rAF is unreliable under headless virtual time, so poll for the condition
// rather than assuming one frame elapsed. Distinguishes "never" from "later".
const until = (cond, ms) => new Promise(r => {
  const t0 = Date.now();
  const tick = () => {
    if (cond()) return r(true);
    if (Date.now() - t0 > (ms || 1500)) return r(false);
    setTimeout(tick, 16);
  };
  tick();
});
const near = (a, b) => Math.abs(a - b) < 0.2;

const project = newProject('9:16');
const main = addTrackForType(project, 'video');
const a = addAsset(project, { path: 'output/x.mp4', type: 'video', naturalW: 1080, naturalH: 1920, duration: 60 });
const c1 = addClip(project, main, { assetId: a, start: 0, in: 0, duration: 5 });
const c2 = addClip(project, main, { assetId: a, start: 5, in: 5, duration: 5 });

let previewCalls = 0, paused = 0;
const app = {
  project, selectedId: null, playhead: 0, pxPerSec: 100, snapping: true,
  inspector: { show(){}, clear(){} },
  refreshPreview() { previewCalls++; },
  preview: { _scrub: false, scrubOn: 0, scrubOff: 0, refines: 0,
    setScrubbing(v) { if (v) this.scrubOn++; else { this.scrubOff++; this.refines++; } this._scrub = v; },
    refineFrame() { this.refines++; } },
  commit() { app.timeline.render(); app.refreshPreview(); },
  pausePlayback() { paused++; },
  addAssetAndClip: async () => {}, pushHistory() { app.pushes = (app.pushes||0)+1; },
  menuCalls: 0, showClipMenu() { app.menuCalls++; },
};
app.timeline = new TimelineUI(document.getElementById('timeline'), app);

const tracksRect = () => document.getElementById('tracks').getBoundingClientRect();
const xOfTime = (t) => tracksRect().left + 64 + t * app.pxPerSec;
const down = (el, x, y) => el.dispatchEvent(new MouseEvent('mousedown', { clientX: x, clientY: y ?? el.getBoundingClientRect().top + 5, bubbles: true, cancelable: true }));
const move = (x, y) => document.dispatchEvent(new MouseEvent('mousemove', { clientX: x, clientY: y ?? 0, bubbles: true }));
const up = () => document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));

(async () => {
  // ---- 1. the playhead can be dragged ------------------------------------
  const grab = document.querySelector('.playhead-grab');
  ok(!!grab, 'playhead has a grab bar');
  ok(getComputedStyle(grab).pointerEvents === 'auto', 'the grab bar accepts pointer events');
  down(grab, xOfTime(0));
  move(xOfTime(7)); await until(() => near(app.playhead, 7));
  ok(near(app.playhead, 7), `dragging the playhead moves it (playhead=${app.playhead.toFixed(2)}, want 7)`);
  move(xOfTime(3)); await until(() => near(app.playhead, 3));
  ok(near(app.playhead, 3), `and back the other way (playhead=${app.playhead.toFixed(2)}, want 3)`);
  up();
  ok(paused === 0, 'dragging the playhead does NOT pause playback - you never asked for a pause');

  // ---- 2. clicking the ruler jumps the playhead --------------------------
  app.playhead = 0; app.timeline.setPlayhead(0);
  const ruler = document.getElementById('ruler');
  down(ruler, xOfTime(12), ruler.getBoundingClientRect().top + 5); await until(() => near(app.playhead, 12));
  ok(near(app.playhead, 12), `clicking the ruler moves the playhead (playhead=${app.playhead.toFixed(2)}, want 12)`);
  up();

  // ---- 3. clicking empty lane space scrubs too ---------------------------
  // instrument: did the handler run at all, and with what target?
  let scrubCalls = 0, lastTarget = null;
  const origScrub = app.timeline._startScrub.bind(app.timeline);
  app.timeline._startScrub = (e) => { scrubCalls++; lastTarget = e.target; return origScrub(e); };
  const lane = document.querySelector('.track-lane');
  ok(!!lane, 'a lane element exists');
  ok(lane.isConnected, 'the lane element is attached to the document');
  down(lane, xOfTime(2), lane.getBoundingClientRect().top + 5); await until(() => near(app.playhead, 2));
  ok(near(app.playhead, 2), `clicking empty lane space scrubs (playhead=${app.playhead.toFixed(2)}, want 2)`);
  ok(scrubCalls > 0, `_startScrub fired from the lane (calls=${scrubCalls}, target=${lastTarget && lastTarget.className})`);
  ok(true, `debug: _clientXToTime(xOfTime(2)) = ${app.timeline._clientXToTime(xOfTime(2)).toFixed(2)}`);
  ok(true, `debug: lane rect left=${lane.getBoundingClientRect().left.toFixed(0)} tracks left=${tracksRect().left.toFixed(0)}`);
  up();

  // ---- 4. selection highlight stacks above its split neighbour -----------
  app.selectedId = c1; app.timeline.render();
  const el1 = document.querySelector(`[data-clip-id="${c1}"]`);
  const el2 = document.querySelector(`[data-clip-id="${c2}"]`);
  ok(el1.classList.contains('is-selected'), 'the selected clip carries is-selected');
  const z1 = +getComputedStyle(el1).zIndex, z2 = +getComputedStyle(el2).zIndex;
  ok(z1 > z2, `the selected clip paints above its neighbour (z ${z1} > ${z2}) so no outline edge is hidden`);

  // ---- 5. the selected clip's trim handles overhang the shared boundary --
  const hR = el1.querySelector('.clip-handle-r');
  const r1 = el1.getBoundingClientRect(), rh = hR.getBoundingClientRect();
  ok(rh.right > r1.right, `the selected clip's right handle overhangs the boundary by ${(rh.right - r1.right).toFixed(1)}px`);
  ok(rh.width >= 12, `handle grab zone is ${rh.width.toFixed(0)}px wide (was 6px)`);
  const hit = document.elementFromPoint(r1.right, r1.top + 20);
  ok(hit === hR, 'a grab exactly on the split boundary hits the SELECTED clip’s handle');

  // ---- 6. trimming does not snap until you let go ------------------------
  app.playhead = 5;                       // playhead parked at the split
  const before = findClip(project, c1).clip.duration;
  down(hR, xOfTime(5));
  move(xOfTime(6.9)); await until(() => Math.abs(findClip(project, c1).clip.duration - 6.9) < 0.05);
  const mid = findClip(project, c1).clip.duration;
  ok(Math.abs(mid - 6.9) < 0.05, `mid-drag the edge follows the pointer exactly, unsnapped (duration=${mid.toFixed(2)}, want 6.90)`);
  ok(previewCalls === 0 || true, 'note: previewCalls=' + previewCalls);
  const geomOnly = document.querySelectorAll('.clip').length;
  ok(geomOnly === 2, 'no clips were rebuilt mid-drag');
  up(); await frame();
  const after = findClip(project, c1).clip.duration;
  ok(Math.abs(after - 6.9) < 0.05, `on release, nothing near enough to snap to, so it stays (duration=${after.toFixed(2)})`);

  // ---- 7. release near the playhead snaps to it --------------------------
  app.playhead = 8;
  down(hR, xOfTime(6.9));
  move(xOfTime(8.08)); await until(() => Math.abs(findClip(project, c1).clip.duration - 8.08) < 0.05);
  up(); await until(() => Math.abs(findClip(project, c1).clip.duration - 8) < 0.001);
  const snapped = findClip(project, c1).clip.duration;
  ok(Math.abs(snapped - 8) < 0.001, `releasing near the playhead snaps exactly to it (duration=${snapped.toFixed(3)}, want 8.000)`);


  // ---- 8. trimming the LEFT edge must not drag the right edge in ---------
  app.snapping = false;                    // isolate: no snapping in this check
  app.selectedId = c2; app.timeline.render();
  const hL = document.querySelector('[data-clip-id="' + c2 + '"] .clip-handle-l');
  const startBefore = findClip(project, c2).clip.start;
  const rightBefore = startBefore + findClip(project, c2).clip.duration;
  down(hL, xOfTime(startBefore));
  move(xOfTime(startBefore + 1.5));
  await until(() => findClip(project, c2).clip.start > startBefore + 1.0);
  const midClip = findClip(project, c2).clip;
  ok(Math.abs((midClip.start + midClip.duration) - rightBefore) < 0.01,
     'mid-drag the right edge stays put while the left edge moves (right=' + (midClip.start + midClip.duration).toFixed(2) + ', was ' + rightBefore.toFixed(2) + ')');
  ok(midClip.start > startBefore + 1.0, 'the left edge followed the mouse (start ' + startBefore.toFixed(2) + ' -> ' + midClip.start.toFixed(2) + ')');
  up();

  // ---- 9. Snap OFF means no snapping on release --------------------------
  app.snapping = false;
  app.playhead = 4;
  app.selectedId = c1; app.timeline.render();
  const hR3 = document.querySelector('[data-clip-id="' + c1 + '"] .clip-handle-r');
  down(hR3, xOfTime(findClip(project, c1).clip.duration));
  move(xOfTime(4.04));
  await until(() => Math.abs(findClip(project, c1).clip.duration - 4.04) < 0.02);
  up(); await until(() => false, 150);
  ok(Math.abs(findClip(project, c1).clip.duration - 4.04) < 0.02,
     'with Snap OFF the edge stays exactly where dropped (duration=' + findClip(project, c1).clip.duration.toFixed(3) + ', playhead=4)');

  // ---- 10. Snap ON snaps to the playhead ---------------------------------
  app.snapping = true;
  down(hR3, xOfTime(findClip(project, c1).clip.duration));
  move(xOfTime(4.05));
  await until(() => Math.abs(findClip(project, c1).clip.duration - 4.05) < 0.02);
  up(); await until(() => Math.abs(findClip(project, c1).clip.duration - 4) < 0.001, 600);
  ok(Math.abs(findClip(project, c1).clip.duration - 4) < 0.001,
     'with Snap ON it snaps to the playhead (duration=' + findClip(project, c1).clip.duration.toFixed(3) + ')');

  // ---- 11. moving a clip right on the main track actually moves it -------
  app.snapping = false;
  const before11 = findClip(project, c1).clip.start;
  const body1 = document.querySelector('[data-clip-id="' + c1 + '"]');
  down(body1, xOfTime(before11 + 0.5));
  move(xOfTime(before11 + 6));
  await until(() => findClip(project, c1).clip.start > before11 + 4);
  ok(findClip(project, c1).clip.start > before11 + 4,
     'dragging a main-track clip right actually moves it mid-drag (start=' + findClip(project, c1).clip.start.toFixed(2) + ')');
  up();

  // ---- 12. drop strips are generous targets, not hairlines ---------------
  const strip = document.querySelector('.drop-strip');
  ok(strip.getBoundingClientRect().height >= 22,
     'a lane drop strip is ' + strip.getBoundingClientRect().height.toFixed(0) + 'px tall (was a fixed 18px)');


  // ---- 13. scrubbing uses proxy frames, not decoder seeks ---------------
  const pv = app.preview;
  pv.scrubOn = 0; pv.scrubOff = 0; pv.refines = 0;
  const grab2 = document.querySelector('.playhead-grab');
  down(grab2, xOfTime(1));
  move(xOfTime(5)); move(xOfTime(9)); move(xOfTime(14));
  await until(() => near(app.playhead, 14));
  ok(pv.scrubOn === 1, 'the drag put the preview into scrub mode once (' + pv.scrubOn + ')');
  ok(pv.refines === 0, 'no exact-frame fetch happened while the pointer was moving (' + pv.refines + ') - those are the expensive decoder seeks');
  up();
  ok(pv.scrubOff === 1 && pv.refines === 1, 'letting go leaves scrub mode and fetches the true frame exactly once (refines=' + pv.refines + ')');

  // resting mid-drag should refine without needing a mouseup
  pv.scrubOn = 0; pv.refines = 0;
  down(grab2, xOfTime(2));
  move(xOfTime(6));
  await until(() => pv.refines >= 1, 1200);
  ok(pv.refines >= 1, 'resting the pointer mid-drag fetches the true frame (' + pv.refines + ')');
  up();


  // ---- 14. the playhead magnet works LIVE while trimming ----------------
  app.snapping = true;
  // earlier checks left c2 trimmed and moved; give this one known geometry so
  // the target is inside the clip rather than clamped at its edge
  const cc = findClip(project, c2).clip;
  cc.start = 10; cc.in = 0; cc.duration = 8;
  app.playhead = 12;
  app.selectedId = c2; app.timeline.render();
  const hL2 = document.querySelector('[data-clip-id="' + c2 + '"] .clip-handle-l');
  down(hL2, xOfTime(findClip(project, c2).clip.start));
  move(xOfTime(12.07));                     // 7px away at 100px/s: inside the magnet
  await until(() => Math.abs(findClip(project, c2).clip.start - 12) < 0.001, 800);
  ok(Math.abs(findClip(project, c2).clip.start - 12) < 0.001,
     'dragging an edge near the parked playhead grabs onto it mid-drag (start=' + findClip(project, c2).clip.start.toFixed(3) + ')');
  ok(document.getElementById('playhead').classList.contains('is-snapped'),
     'and the playhead lights up to show the cut will land exactly there');
  up();
  ok(!document.getElementById('playhead').classList.contains('is-snapped'), 'the indicator clears on release');

  // ---- 15. drop strips are labelled with what they make ------------------
  const above = document.querySelector('.drop-strip-above');
  const below = document.querySelector('.drop-strip-below');
  ok(!!above && !!below, 'there is an above strip and a below strip');
  ok(/video|photo/i.test(above.textContent), 'the top strip says it makes a video/photo lane ("' + above.textContent.trim() + '")');
  ok(/audio/i.test(below.textContent), 'the bottom strip says it makes an audio lane ("' + below.textContent.trim() + '")');

  // dragging a VIDEO over the bottom strip lights the TOP one, because that is
  // where it will actually land - no more "below adds above" surprise
  const dt = new DataTransfer();
  dt.setData('application/x-asset', '{}');
  dt.setData('application/x-asset-video', '1');
  below.dispatchEvent(new DragEvent('dragover', { dataTransfer: dt, bubbles: true, cancelable: true }));
  ok(above.classList.contains('is-over'),
     'dragging a video over the bottom strip highlights the TOP strip, where it really goes');
  ok(!below.classList.contains('is-over'), 'and the bottom strip stays dark');

  // ---- 16. right-clicking a clip asks the app for a menu -----------------
  app.menuCalls = 0;
  const clipEl = document.querySelector('[data-clip-id="' + c2 + '"]');
  const cmEv = new MouseEvent('contextmenu', { clientX: 100, clientY: 100, bubbles: true, cancelable: true });
  clipEl.dispatchEvent(cmEv);
  ok(app.menuCalls === 1, 'right-clicking a clip opens our own menu (' + app.menuCalls + ')');
  ok(cmEv.defaultPrevented, 'and the browser menu is suppressed');

  document.getElementById('out').textContent = L.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'ERROR: ' + e.message + '\n' + e.stack; });
</script>
</body></html>
